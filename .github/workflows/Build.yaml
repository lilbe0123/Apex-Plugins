name: Build Plugin

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile TypeScript
        working-directory: plugins/nsfwbypass
        run: |
          npx -y typescript@5.4 tsc \
            --outDir . \
            --rootDir . \
            --noEmitOnError false

      - name: Point manifest at compiled JS
        run: |
          node -e '
            const fs=require("fs");
            const p="plugins/nsfwbypass/manifest.json";
            const m=JSON.parse(fs.readFileSync(p,"utf8"));
            m.main=m.main.replace(/\.tsx?$/,".js");
            fs.writeFileSync(p,JSON.stringify(m,null,4));
          '

      - name: Commit compiled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/nsfwbypass
          git diff --staged --quiet || git commit -m "Build: compile TypeScript [skip ci]"
          git push
